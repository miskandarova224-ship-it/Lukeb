name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Loyiha fayllarini yaratish
        run: |
          echo "Barcha fayllar:"
          find . -type f -not -path './.git/*'
          f=$(find . -iname 'setup*' -type f -not -path './.git/*' | head -n 1)
          if [ -z "$f" ]; then
            echo "XATO: setup.sh fayli repository'da topilmadi. Uni yuklang."
            exit 1
          fi
          echo "Topilgan fayl: $f"
          bash "$f"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Gemini kalitini joylash (ixtiyoriy)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: sed -i "s|__GEMINI_API_KEY__|${GEMINI_API_KEY}|" app/src/main/assets/config.js
      - name: APK yigish
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AgentLumen-apk
          path: app/build/outputs/apk/debug/app-debug.apk
